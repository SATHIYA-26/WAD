<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Time Game</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><p class="eyebrow">TEST YOUR REFLEXES</p><h1>Reaction Time</h1><p>Press Start, wait for the green screen, then click as quickly as you can.</p><section id="arena" class="arena"><span id="message">Press Start to begin</span></section><button id="start">Start Game</button><p id="result" aria-live="polite">Your reaction time will appear here.</p><p>Best time: <b id="best">—</b></p></main><script>
const arena=document.querySelector('#arena'),message=document.querySelector('#message'),result=document.querySelector('#result'),start=document.querySelector('#start'),bestText=document.querySelector('#best');let state='idle',timeout=null,startedAt=0,best=Number(localStorage.getItem('reactionBest')||0);bestText.textContent=best?best+' ms':'—';
function reset(){clearTimeout(timeout);state='idle';arena.className='arena';message.textContent='Press Start to begin';start.disabled=false;start.textContent='Start Game';}
start.addEventListener('click',()=>{clearTimeout(timeout);state='waiting';arena.className='arena waiting';message.textContent='Wait for green…';result.textContent='Do not click yet!';start.disabled=true;timeout=setTimeout(()=>{if(state!=='waiting')return;state='ready';arena.className='arena ready';message.textContent='CLICK NOW!';startedAt=performance.now();},1500+Math.random()*3000);});
arena.addEventListener('click',()=>{if(state==='waiting'){clearTimeout(timeout);state='early';arena.className='arena early';message.textContent='Too soon!';result.textContent='You clicked before the green signal. Try again.';start.disabled=false;start.textContent='Try Again';}else if(state==='ready'){const ms=Math.round(performance.now()-startedAt);state='done';arena.className='arena done';message.textContent=ms+' ms';result.textContent=ms<250?'Lightning fast!':ms<400?'Nice reaction!':'Good try — see if you can go faster!';if(!best||ms<best){best=ms;localStorage.setItem('reactionBest',best);bestText.textContent=best+' ms';}start.disabled=false;start.textContent='Play Again';}});
</script></body></html>
