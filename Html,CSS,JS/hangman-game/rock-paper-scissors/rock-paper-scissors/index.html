<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rock Paper Scissors</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Rock Paper Scissors</h1><p>Choose your move to play against the computer.</p><div class="choices"><button data-move="rock">✊<br>Rock</button><button data-move="paper">✋<br>Paper</button><button data-move="scissors">✌️<br>Scissors</button></div><section class="result"><p id="moves">You: — | Computer: —</p><h2 id="result">Make your move!</h2></section><p>Wins: <b id="wins">0</b> | Losses: <b id="losses">0</b> | Draws: <b id="draws">0</b></p><button id="reset">Reset Score</button></main><script>
const options=['rock','paper','scissors'];let wins=0,losses=0,draws=0;
document.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('click',()=>{const you=btn.dataset.move,computer=options[Math.floor(Math.random()*3)];document.querySelector('#moves').textContent='You: '+you+' | Computer: '+computer;let result;if(you===computer){draws++;result="It's a draw!";}else if((you==='rock'&&computer==='scissors')||(you==='paper'&&computer==='rock')||(you==='scissors'&&computer==='paper')){wins++;result='You win! 🎉';}else{losses++;result='Computer wins!';}document.querySelector('#result').textContent=result;document.querySelector('#wins').textContent=wins;document.querySelector('#losses').textContent=losses;document.querySelector('#draws').textContent=draws;}));
document.querySelector('#reset').addEventListener('click',()=>{wins=losses=draws=0;['wins','losses','draws'].forEach(id=>document.querySelector('#'+id).textContent='0');document.querySelector('#moves').textContent='You: — | Computer: —';document.querySelector('#result').textContent='Make your move!';});
</script></body></html>
