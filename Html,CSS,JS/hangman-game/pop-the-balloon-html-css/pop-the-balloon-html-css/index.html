<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop the Balloon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">A LITTLE FUN</p>
      <h1>Pop the Balloon! 🎈</h1>
      <p class="subtitle">Pop as many balloons as you can in 30 seconds.</p>
    </header>

    <section class="stats">
      <div><span>SCORE</span><strong id="score">0</strong></div>
      <div><span>TIME LEFT</span><strong id="time">30</strong></div>
      <div><span>BEST</span><strong id="best">0</strong></div>
    </section>

    <section id="playArea" class="play-area" aria-label="Balloon play area">
      <p class="hint" id="hint">Press Start Game, then tap the balloons!</p>
    </section>

    <button id="start" class="start-button" type="button">Start Game</button>
    <p id="message" aria-live="polite">Ready to pop? 🎉</p>
  </main>
  <script>
    const playArea = document.querySelector('#playArea');
    const scoreText = document.querySelector('#score');
    const timeText = document.querySelector('#time');
    const bestText = document.querySelector('#best');
    const message = document.querySelector('#message');
    const startButton = document.querySelector('#start');
    let score = 0, timeLeft = 30, running = false, clockTimer, balloonTimer;
    let best = Number(localStorage.getItem('balloonBest') || 0);
    bestText.textContent = best;

    const colors = ['pink', 'blue', 'yellow', 'purple', 'green', 'orange'];

    function makeBalloon() {
      if (!running) return;
      const hint = document.querySelector('#hint');
      if (hint) hint.remove();
      const balloon = document.createElement('button');
      balloon.type = 'button';
      balloon.className = `balloon ${colors[Math.floor(Math.random() * colors.length)]}`;
      balloon.setAttribute('aria-label', 'Pop balloon');
      balloon.style.left = `${5 + Math.random() * 78}%`;
      balloon.style.top = `${5 + Math.random() * 72}%`;
      balloon.addEventListener('click', () => {
        if (!running || balloon.classList.contains('popped')) return;
        balloon.classList.add('popped');
        score++;
        scoreText.textContent = score;
        message.textContent = ['Pop!', 'Great shot!', 'Nice one!'][Math.floor(Math.random() * 3)];
        if (score > best) {
          best = score;
          bestText.textContent = best;
          localStorage.setItem('balloonBest', best);
        }
        setTimeout(() => balloon.remove(), 140);
      });
      playArea.appendChild(balloon);
      setTimeout(() => { if (balloon.isConnected) balloon.remove(); }, 2200);
    }

    function endGame() {
      running = false;
      clearInterval(clockTimer);
      clearInterval(balloonTimer);
      playArea.innerHTML = '<p class="finished">Time is up! 🎉</p>';
      message.textContent = `You popped ${score} balloons.`;
      startButton.textContent = 'Play Again';
    }

    function startGame() {
      clearInterval(clockTimer);
      clearInterval(balloonTimer);
      score = 0; timeLeft = 30; running = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      playArea.innerHTML = '';
      message.textContent = 'Go! Pop, pop, pop!';
      startButton.textContent = 'Restart Game';
      makeBalloon();
      balloonTimer = setInterval(makeBalloon, 600);
      clockTimer = setInterval(() => {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }
    startButton.addEventListener('click', startGame);
  </script>
</body>
</html>
