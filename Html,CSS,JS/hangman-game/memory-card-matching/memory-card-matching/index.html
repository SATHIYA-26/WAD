<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Memory Match 🧠</h1><p>Flip two cards and find all eight pairs.</p><div class="stats">Moves: <b id="moves">0</b> &nbsp; Pairs: <b id="pairs">0/8</b> &nbsp; Time: <b id="time">0:00</b></div><div id="grid" class="grid"></div><p id="message" aria-live="polite">Find the matching pairs!</p><button id="restart">Restart Game</button></main><script>
const symbols=['🍎','🍋','🍇','🍉','🍓','🍒','🥝','🍍'];const grid=document.querySelector('#grid');let first=null,second=null,locked=false,moves=0,pairs=0,seconds=0,timer=null,started=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTimer(){if(started)return;started=true;timer=setInterval(()=>{seconds++;document.querySelector('#time').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');},1000);}
function resetTurn(){first=null;second=null;locked=false;}
function flip(card){if(locked||card===first||card.classList.contains('matched')||card.classList.contains('open'))return;startTimer();card.classList.add('open');card.querySelector('.face').textContent=card.dataset.symbol;if(!first){first=card;return;}second=card;moves++;document.querySelector('#moves').textContent=moves;if(first.dataset.symbol===second.dataset.symbol){first.classList.add('matched');second.classList.add('matched');pairs++;document.querySelector('#pairs').textContent=pairs+'/8';resetTurn();if(pairs===symbols.length){clearInterval(timer);document.querySelector('#message').textContent='You found every pair in '+moves+' moves! 🎉';}}else{locked=true;document.querySelector('#message').textContent='Not a match. Try again!';setTimeout(()=>{[first,second].forEach(c=>{c.classList.remove('open');c.querySelector('.face').textContent='';});resetTurn();},750);}}
function newGame(){clearInterval(timer);first=second=null;locked=false;moves=pairs=seconds=0;started=false;document.querySelector('#moves').textContent='0';document.querySelector('#pairs').textContent='0/8';document.querySelector('#time').textContent='0:00';document.querySelector('#message').textContent='Find the matching pairs!';grid.innerHTML='';shuffle([...symbols,...symbols]).forEach(symbol=>{const c=document.createElement('button');c.type='button';c.className='card';c.dataset.symbol=symbol;c.setAttribute('aria-label','Memory card');c.innerHTML='<span class="back">?</span><span class="face"></span>';c.addEventListener('click',()=>flip(c));grid.appendChild(c);});}
document.querySelector('#restart').addEventListener('click',newGame);newGame();
</script></body></html>
