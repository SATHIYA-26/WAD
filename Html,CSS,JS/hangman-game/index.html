<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangman</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Hangman</h1><p>Guess the hidden word one letter at a time.</p><div class="drawing" id="drawing">🙂</div><h2 id="word"></h2><p>Wrong guesses: <b id="wrong">0</b> / 6</p><div id="letters" class="letters"></div><p id="message" aria-live="polite">Choose a letter to begin.</p><button id="new">New Word</button></main><script>
const words=['JAVASCRIPT','BROWSER','HTML','COMPUTER','WEBSITE','PYTHON','PROGRAM'];let word='',guessed=new Set(),wrong=0,over=false;const letters=document.querySelector('#letters');
function render(){document.querySelector('#word').textContent=[...word].map(ch=>guessed.has(ch)?ch:'_').join(' ');document.querySelector('#wrong').textContent=wrong;document.querySelector('#drawing').textContent=['🙂','😐','😟','😣','😵','☠️','💀'][wrong];}
function choose(ch,button){if(over||guessed.has(ch))return;guessed.add(ch);button.disabled=true;if(!word.includes(ch))wrong++;render();if([...word].every(c=>guessed.has(c))){over=true;document.querySelector('#message').textContent='You won! 🎉';letters.querySelectorAll('button').forEach(b=>b.disabled=true);}else if(wrong>=6){over=true;document.querySelector('#message').textContent='Game over! The word was '+word+'.';letters.querySelectorAll('button').forEach(b=>b.disabled=true);}else document.querySelector('#message').textContent=word.includes(ch)?'Good guess!':'Not this time. Try another letter.';}
function newGame(){word=words[Math.floor(Math.random()*words.length)];guessed=new Set();wrong=0;over=false;document.querySelector('#message').textContent='Choose a letter to begin.';letters.innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.addEventListener('click',()=>choose(ch,b));letters.appendChild(b);});render();}
document.querySelector('#new').addEventListener('click',newGame);newGame();
</script></body></html>
