<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Mole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">QUICK REFLEXES</p>
      <h1>Whack-a-Mole! <span>🐹</span></h1>
      <p class="subtitle">Click the mole before it disappears.</p>
    </header>

    <section class="stats">
      <div><span>SCORE</span><strong id="score">0</strong></div>
      <div><span>TIME LEFT</span><strong id="time">30</strong></div>
      <div><span>BEST</span><strong id="best">0</strong></div>
    </section>

    <section id="grid" class="grid" aria-label="Mole holes">
      <button class="hole" aria-label="Hole 1"></button><button class="hole" aria-label="Hole 2"></button><button class="hole" aria-label="Hole 3"></button>
      <button class="hole" aria-label="Hole 4"></button><button class="hole" aria-label="Hole 5"></button><button class="hole" aria-label="Hole 6"></button>
      <button class="hole" aria-label="Hole 7"></button><button class="hole" aria-label="Hole 8"></button><button class="hole" aria-label="Hole 9"></button>
    </section>

    <button id="start" class="start-button" type="button">Start Game</button>
    <p id="message" aria-live="polite">Ready? Start when you're set!</p>
  </main>
  <script>
    const holes = [...document.querySelectorAll('.hole')];
    const scoreText = document.querySelector('#score');
    const timeText = document.querySelector('#time');
    const bestText = document.querySelector('#best');
    const message = document.querySelector('#message');
    const startButton = document.querySelector('#start');
    let score = 0, timeLeft = 30, activeHole = -1, running = false, moleTimer, clockTimer;
    let best = Number(localStorage.getItem('whackBest') || 0);
    bestText.textContent = best;

    function showMole() {
      holes.forEach(hole => hole.classList.remove('up'));
      activeHole = Math.floor(Math.random() * holes.length);
      holes[activeHole].classList.add('up');
    }

    function endGame() {
      running = false;
      clearInterval(moleTimer);
      clearInterval(clockTimer);
      holes.forEach(hole => hole.classList.remove('up'));
      activeHole = -1;
      message.textContent = `Time's up! You scored ${score}.`;
      startButton.textContent = 'Play Again';
    }

    function startGame() {
      clearInterval(moleTimer);
      clearInterval(clockTimer);
      score = 0; timeLeft = 30; running = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      message.textContent = 'Go! Catch as many moles as you can.';
      startButton.textContent = 'Restart Game';
      showMole();
      moleTimer = setInterval(showMole, 750);
      clockTimer = setInterval(() => {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    holes.forEach((hole, index) => hole.addEventListener('click', () => {
      if (!running || index !== activeHole) return;
      score++;
      scoreText.textContent = score;
      if (score > best) {
        best = score;
        bestText.textContent = best;
        localStorage.setItem('whackBest', best);
      }
      hole.classList.remove('up');
      activeHole = -1;
      message.textContent = 'Nice hit! Keep going!';
    }));
    startButton.addEventListener('click', startGame);
  </script>
</body>
</html>
