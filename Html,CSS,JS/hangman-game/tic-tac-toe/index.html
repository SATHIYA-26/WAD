<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-Tac-Toe</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Tic-Tac-Toe</h1><p>Take turns and get three in a row!</p><h2 id="status">Player X's turn</h2><div class="board" id="board"><button class="cell" data-i="0" aria-label="Cell 1"></button><button class="cell" data-i="1" aria-label="Cell 2"></button><button class="cell" data-i="2" aria-label="Cell 3"></button><button class="cell" data-i="3" aria-label="Cell 4"></button><button class="cell" data-i="4" aria-label="Cell 5"></button><button class="cell" data-i="5" aria-label="Cell 6"></button><button class="cell" data-i="6" aria-label="Cell 7"></button><button class="cell" data-i="7" aria-label="Cell 8"></button><button class="cell" data-i="8" aria-label="Cell 9"></button></div><p>X: <b id="xs">0</b> | Draws: <b id="ds">0</b> | O: <b id="os">0</b></p><button id="restart">Restart Round</button></main><script>
const cells=[...document.querySelectorAll('.cell')], status=document.querySelector('#status');let board=Array(9).fill(''),player='X',over=false,x=0,o=0,d=0;
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function move(i){if(over||board[i])return;board[i]=player;cells[i].textContent=player;cells[i].classList.add(player.toLowerCase());let win=lines.some(([a,b,c])=>board[a]&&board[a]===board[b]&&board[a]===board[c]);if(win){over=true;status.textContent='Player '+player+' wins!';if(player==='X')x++;else o++;}else if(board.every(Boolean)){over=true;status.textContent="It's a draw!";d++;}else{player=player==='X'?'O':'X';status.textContent="Player "+player+"'s turn";}document.querySelector('#xs').textContent=x;document.querySelector('#os').textContent=o;document.querySelector('#ds').textContent=d;if(over)cells.forEach(c=>c.disabled=true);}
function restart(){board=Array(9).fill('');player='X';over=false;status.textContent="Player X's turn";cells.forEach(c=>{c.textContent='';c.disabled=false;c.className='cell';});}
cells.forEach(c=>c.addEventListener('click',()=>move(Number(c.dataset.i))));document.querySelector('#restart').addEventListener('click',restart);
</script></body></html>
