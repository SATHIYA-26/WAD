<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon Says</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Simon Says 🎨</h1><p>Watch the color sequence, then repeat it in the same order.</p><div class="stats">Round: <b id="round">0</b> &nbsp; Best: <b id="best">0</b></div><div class="pads"><button class="pad green" data-color="green" aria-label="Green"></button><button class="pad red" data-color="red" aria-label="Red"></button><button class="pad yellow" data-color="yellow" aria-label="Yellow"></button><button class="pad blue" data-color="blue" aria-label="Blue"></button></div><p id="message" aria-live="polite">Press Start Game.</p><button id="start">Start Game</button></main><script>
const colors=['green','red','yellow','blue'],pads=[...document.querySelectorAll('.pad')],message=document.querySelector('#message');let sequence=[],position=0,playing=false,accepting=false,best=Number(localStorage.getItem('simonBest')||0);document.querySelector('#best').textContent=best;
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function flash(color){const pad=pads.find(p=>p.dataset.color===color);pad.classList.add('lit');await sleep(350);pad.classList.remove('lit');await sleep(130);}
async function showSequence(){accepting=false;message.textContent='Watch carefully…';for(const color of sequence){await flash(color);}position=0;accepting=true;message.textContent='Your turn! Repeat the sequence.';}
async function startGame(){sequence=[];position=0;playing=true;document.querySelector('#round').textContent='0';document.querySelector('#start').disabled=true;sequence.push(colors[Math.floor(Math.random()*colors.length)]);document.querySelector('#round').textContent='1';await showSequence();}
pads.forEach(pad=>pad.addEventListener('click',async()=>{if(!playing||!accepting)return;const color=pad.dataset.color;await flash(color);if(color!==sequence[position]){playing=false;accepting=false;message.textContent='Game over! You reached round '+sequence.length+'.';document.querySelector('#start').disabled=false;document.querySelector('#start').textContent='Play Again';return;}position++;if(position===sequence.length){if(sequence.length>best){best=sequence.length;localStorage.setItem('simonBest',best);document.querySelector('#best').textContent=best;}message.textContent='Correct!';await sleep(550);sequence.push(colors[Math.floor(Math.random()*colors.length)]);document.querySelector('#round').textContent=sequence.length;await showSequence();}}));
document.querySelector('#start').addEventListener('click',startGame);
</script></body></html>
