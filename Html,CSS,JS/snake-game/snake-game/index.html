<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Game</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Snake Game 🐍</h1><p>Use arrow keys or WASD to eat food. Avoid walls and your tail.</p><div class="score">Score: <b id="score">0</b></div><canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas><p id="message" aria-live="polite">Press Start Game.</p><button id="start">Start Game</button><div class="controls"><button data-dir="up">↑</button><div><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),size=20,cells=20;let snake=[],food={},dir={x:1,y:0},nextDir={x:1,y:0},score=0,running=false,timer=null;
function placeFood(){do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function draw(){ctx.fillStyle='#f3f9f3';ctx.fillRect(0,0,400,400);ctx.fillStyle='#ed7474';ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2, size/2-2,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#218653':'#53bd7c';ctx.fillRect(s.x*size+1,s.y*size+1,size-2,size-2);});}
function end(){running=false;clearInterval(timer);document.querySelector('#message').textContent='Game over! Final score: '+score+'.';document.querySelector('#start').disabled=false;document.querySelector('#start').textContent='Play Again';}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||body.some(s=>s.x===head.x&&s.y===head.y)){end();return;}snake.unshift(head);if(eating){score++;document.querySelector('#score').textContent=score;placeFood();}else snake.pop();draw();}
function setDirection(name){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const candidate=dirs[name];if(!candidate)return;if(candidate.x===-dir.x&&candidate.y===-dir.y)return;nextDir=candidate;}
function start(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;running=true;document.querySelector('#score').textContent='0';document.querySelector('#message').textContent='Good luck!';document.querySelector('#start').disabled=true;placeFood();draw();timer=setInterval(tick,130);}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key]);}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir)));document.querySelector('#start').addEventListener('click',start);draw();
</script></body></html>
