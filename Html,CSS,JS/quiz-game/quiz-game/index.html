<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Quiz</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Quick Quiz 🧩</h1><p>Answer all five web basics questions.</p><div class="progress"><span id="progress">Question 1 of 5</span><span id="score">Score: 0</span></div><div class="track"><div id="bar"></div></div><section id="quiz"><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" disabled>Next Question</button></section><section id="finish" hidden><h2>Quiz Complete! 🏆</h2><p id="final"></p><button id="restart">Try Again</button></section></main><script>
const questions=[
{q:'Which language adds interactivity to web pages?',a:['HTML','CSS','JavaScript','SQL'],correct:2},
{q:'Which HTML tag creates a hyperlink?',a:['<link>','<a>','<href>','<url>'],correct:1},
{q:'Which CSS property changes text color?',a:['font-style','background','text-size','color'],correct:3},
{q:'Which keyword declares a reassignable block-scoped variable?',a:['const','let','fixed','define'],correct:1},
{q:'Which method selects an element by its ID?',a:['getElementById()','queryAll()','selectId()','findElement()'],correct:0}];
let order=[],index=0,score=0,answered=false;
const quiz=document.querySelector('#quiz'),finish=document.querySelector('#finish'),answers=document.querySelector('#answers'),next=document.querySelector('#next');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){answered=false;const item=questions[order[index]];document.querySelector('#progress').textContent='Question '+(index+1)+' of '+questions.length;document.querySelector('#score').textContent='Score: '+score;document.querySelector('#bar').style.width=(index/questions.length*100)+'%';document.querySelector('#question').textContent=item.q;answers.innerHTML='';document.querySelector('#feedback').textContent='';next.disabled=true;next.textContent=index===questions.length-1?'See Results':'Next Question';item.a.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=text;b.addEventListener('click',()=>choose(i,b));answers.appendChild(b);});}
function choose(i,button){if(answered)return;answered=true;const item=questions[order[index]],buttons=[...answers.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);if(i===item.correct){score++;button.classList.add('correct');document.querySelector('#feedback').textContent='Correct! 🎉';}else{button.classList.add('wrong');buttons[item.correct].classList.add('correct');document.querySelector('#feedback').textContent='Incorrect. The correct answer is highlighted.';}document.querySelector('#score').textContent='Score: '+score;next.disabled=false;}
function showFinish(){quiz.hidden=true;finish.hidden=false;document.querySelector('#bar').style.width='100%';document.querySelector('#progress').textContent='Completed';document.querySelector('#final').textContent='You scored '+score+' out of '+questions.length+'.';}
function start(){order=shuffle([0,1,2,3,4]);index=score=0;quiz.hidden=false;finish.hidden=true;render();}
next.addEventListener('click',()=>{if(!answered)return;if(index<questions.length-1){index++;render();}else showFinish();});document.querySelector('#restart').addEventListener('click',start);start();
</script></body></html>
