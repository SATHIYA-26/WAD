<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Guessing Game</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Number Guessing</h1><p>I'm thinking of a number from 1 to 100.</p><form id="form"><input id="guess" type="number" min="1" max="100" placeholder="Enter your guess" required><button type="submit">Guess</button></form><h3 id="message" aria-live="polite">Enter a number to start!</h3><p>Attempts: <b id="attempts">0</b></p><p>Best score (fewest guesses): <b id="best">—</b></p><button id="new">New Game</button></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#guess'),msg=document.querySelector('#message');let secret=newNumber(),attempts=0,done=false,best=Number(localStorage.getItem('numberGuessBest')||0);document.querySelector('#best').textContent=best||'—';
function newNumber(){return Math.floor(Math.random()*100)+1;}
form.addEventListener('submit',e=>{e.preventDefault();if(done){msg.textContent='Start a new game to play again.';return;}const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>100){msg.textContent='Enter a whole number from 1 to 100.';return;}attempts++;document.querySelector('#attempts').textContent=attempts;if(n===secret){done=true;msg.textContent='Correct! You guessed it in '+attempts+' attempt(s)! 🎉';if(!best||attempts<best){best=attempts;localStorage.setItem('numberGuessBest',best);document.querySelector('#best').textContent=best;}input.disabled=true;form.querySelector('button').disabled=true;}else msg.textContent=n<secret?'Too low! Try higher.':'Too high! Try lower.';});
document.querySelector('#new').addEventListener('click',()=>{secret=newNumber();attempts=0;done=false;document.querySelector('#attempts').textContent='0';msg.textContent='New number chosen. Good luck!';input.value='';input.disabled=false;form.querySelector('button').disabled=false;input.focus();});
</script></body></html>
